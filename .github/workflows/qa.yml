name: QA

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JSON-LD examples with SHACL
        run: |
          docker run --rm -v $PWD:/work -w /work stain/jena:latest bash validate-examples.sh

  build:
    uses: netwerk-digitaal-erfgoed/workflows/.github/workflows/spec.yml@v1.2.1

  # Merges Dependabot’s updates, such as a new release of the shared workflow, once
  # the spec builds with them. An update that breaks the build stays open.
  auto-merge:
    needs: [validate, build]
    uses: netwerk-digitaal-erfgoed/workflows/.github/workflows/dependabot-auto-merge.yml@v1.2.1
    secrets: inherit
